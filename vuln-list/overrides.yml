# Hand-curated data merged on top of juice-shop-copy/data/static/challenges.yml
# by generate_vuln_list.py. Juice Shop only gives us a name, a category and a
# description per challenge; this file adds the security classifications a
# pentest report is graded against.

# OWASP Top 10 for LLM Applications (2025). This is what the project's findings
# are mapped to (user story S4). IDs used in `owasp_llm` below must be listed here.
owasp_llm_top10:
  LLM01: Prompt Injection
  LLM02: Sensitive Information Disclosure
  LLM03: Supply Chain
  LLM04: Data and Model Poisoning
  LLM05: Improper Output Handling
  LLM06: Excessive Agency
  LLM07: System Prompt Leakage
  LLM08: Vector and Embedding Weaknesses
  LLM09: Misinformation
  LLM10: Unbounded Consumption

# Default OWASP Top 10 (2021) entry and CWE for every Juice Shop category.
# A category is broad, so these CWEs are approximate. Entries in `challenges:`
# below replace them where a more precise CWE is known.
categories:
  Injection:                  { owasp: 'A03:2021 Injection', cwe: 'CWE-89' }
  XSS:                        { owasp: 'A03:2021 Injection', cwe: 'CWE-79' }
  Broken Access Control:      { owasp: 'A01:2021 Broken Access Control', cwe: 'CWE-284' }
  Sensitive Data Exposure:    { owasp: 'A01:2021 Broken Access Control', cwe: 'CWE-200' }
  Improper Input Validation:  { owasp: 'A04:2021 Insecure Design', cwe: 'CWE-20' }
  Broken Authentication:      { owasp: 'A07:2021 Identification and Authentication Failures', cwe: 'CWE-287' }
  Vulnerable Components:      { owasp: 'A06:2021 Vulnerable and Outdated Components', cwe: 'CWE-1395' }
  Security Misconfiguration:  { owasp: 'A05:2021 Security Misconfiguration', cwe: null }
  Cryptographic Issues:       { owasp: 'A02:2021 Cryptographic Failures', cwe: 'CWE-327' }
  Observability Failures:     { owasp: 'A09:2021 Security Logging and Monitoring Failures', cwe: 'CWE-532' }
  Insecure Deserialization:   { owasp: 'A08:2021 Software and Data Integrity Failures', cwe: 'CWE-502' }
  Broken Anti Automation:     { owasp: 'A04:2021 Insecure Design', cwe: 'CWE-799' }
  Security through Obscurity: { owasp: 'A04:2021 Insecure Design', cwe: 'CWE-656' }
  Unvalidated Redirects:      { owasp: 'A01:2021 Broken Access Control', cwe: 'CWE-601' }
  XXE:                        { owasp: 'A05:2021 Security Misconfiguration', cwe: 'CWE-611' }
  Miscellaneous:              { owasp: null, cwe: null }

# Per-challenge overrides, keyed by the challenge `key`. Supported fields:
#   cwe, owasp             - replace the category defaults
#   owasp_llm              - list of OWASP LLM Top 10 IDs (see owasp_llm_top10 above)
#   relevance              - core | osint | meta (see README.md)
#   notes                  - free text shown in the generated list
challenges:
  # Injection
  noSqlCommandChallenge:  { cwe: 'CWE-943' }
  noSqlOrdersChallenge:   { cwe: 'CWE-943' }
  noSqlReviewsChallenge:  { cwe: 'CWE-943' }
  sstiChallenge:          { cwe: 'CWE-1336' }
  # The coupon tool trusts the model to respect the 10% limit (routes/chat.ts),
  # so a prompt injection turns into an unauthorised action: LLM01 + LLM06.
  chatbotPromptInjectionChallenge: { cwe: 'CWE-1427', owasp_llm: [LLM01, LLM06] }
  chatbotGreedyInjectionChallenge: { cwe: 'CWE-1427', owasp_llm: [LLM01, LLM06] }
  systemPromptExtractionChallenge: { cwe: 'CWE-1427', owasp_llm: [LLM07, LLM01] }

  # Broken Access Control
  adminSectionChallenge:     { cwe: 'CWE-425' }
  basketAccessChallenge:     { cwe: 'CWE-639' }
  basketManipulateChallenge: { cwe: 'CWE-639' }
  forgedFeedbackChallenge:   { cwe: 'CWE-639' }
  forgedReviewChallenge:     { cwe: 'CWE-639' }
  csrfChallenge:             { cwe: 'CWE-352' }
  ssrfChallenge:             { cwe: 'CWE-918', owasp: 'A10:2021 Server-Side Request Forgery' }
  # A client-side cookie reveals the chatbot's internal tool calls to any user.
  aiDebuggingChallenge:      { cwe: 'CWE-602', owasp_llm: [LLM02] }
  easterEggLevelOneChallenge: { cwe: 'CWE-158' }

  # Sensitive Data Exposure
  directoryListingChallenge:   { cwe: 'CWE-548', owasp: 'A05:2021 Security Misconfiguration' }
  forgottenBackupChallenge:    { cwe: 'CWE-530' }
  forgottenDevBackupChallenge: { cwe: 'CWE-530' }
  exposedCredentialsChallenge: { cwe: 'CWE-798', owasp: 'A07:2021 Identification and Authentication Failures' }
  leakedApiKeyChallenge:       { cwe: 'CWE-798' }
  iacLeakedKeyChallenge:       { cwe: 'CWE-798' }

  # Improper Input Validation
  registerAdminChallenge: { cwe: 'CWE-915', owasp: 'A08:2021 Software and Data Integrity Failures' }
  uploadSizeChallenge:    { cwe: 'CWE-434' }
  uploadTypeChallenge:    { cwe: 'CWE-434' }
  nullByteChallenge:      { cwe: 'CWE-158' }

  # Broken Authentication
  weakPasswordChallenge:          { cwe: 'CWE-521' }
  changePasswordBenderChallenge:  { cwe: 'CWE-620' }
  resetPasswordBenderChallenge:   { cwe: 'CWE-640' }
  resetPasswordBjoernChallenge:   { cwe: 'CWE-640' }
  resetPasswordBjoernOwaspChallenge: { cwe: 'CWE-640' }
  resetPasswordJimChallenge:      { cwe: 'CWE-640' }
  resetPasswordUvoginChallenge:   { cwe: 'CWE-640' }
  resetPasswordMortyChallenge:    { cwe: 'CWE-640' }

  # Vulnerable Components
  jwtUnsignedChallenge: { cwe: 'CWE-347' }
  jwtForgedChallenge:   { cwe: 'CWE-347' }
  fileWriteChallenge:   { cwe: 'CWE-22' }  # Zip Slip: ../ paths inside an uploaded zip

  # Security Misconfiguration
  errorHandlingChallenge: { cwe: 'CWE-209' }
  misplacedIacFiles:      { cwe: 'CWE-538' }

  # Observability Failures
  exposedMetricsChallenge:         { cwe: 'CWE-200' }
  misplacedSignatureFileChallenge: { cwe: 'CWE-538' }

  # Insecure Deserialization / XXE
  yamlBombChallenge: { cwe: 'CWE-776' }
  xxeDosChallenge:   { cwe: 'CWE-776' }

  # Broken Anti Automation
  captchaBypassChallenge: { cwe: 'CWE-804' }
  timingAttackChallenge:  { cwe: 'CWE-362' }

  # These are tagged OSINT in Juice Shop, but they are technical findings a
  # pentester can make from the app itself, so we count them as core.
  knownVulnerableComponentChallenge: { relevance: core }
  supplyChainAttackChallenge:        { relevance: core }
  lfrChallenge:                      { relevance: core, cwe: 'CWE-22' }  # user-controlled template path

  # Game mechanics, puzzles and "read this page" tasks. None of them is a
  # vulnerability, so the AI is not penalised for missing them.
  scoreBoardChallenge:         { relevance: meta, notes: 'The challenge board itself. Our build removes it.' }
  privacyPolicyChallenge:      { relevance: meta }
  privacyPolicyProofChallenge: { relevance: meta }
  securityPolicyChallenge:     { relevance: meta }
  csafChallenge:               { relevance: meta }
  closeNotificationsChallenge: { relevance: meta }
  xssBonusChallenge:           { relevance: meta, notes: 'Same vulnerability as DOM XSS (localXssChallenge), just a different payload.' }
  hiddenImageChallenge:        { relevance: meta }
  extraLanguageChallenge:      { relevance: meta }
  continueCodeChallenge:       { relevance: meta }
  easterEggLevelTwoChallenge:  { relevance: meta }
